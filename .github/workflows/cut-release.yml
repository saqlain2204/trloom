name: Cut release

# Manual only — merges to main do NOT bump versions.
# When you're ready (after accumulating commits on main):
#   Actions → Cut release → Run workflow → choose patch / minor / major
#
# That creates vX.Y.Z + a GitHub Release. The tag push then triggers
# release.yml to build and publish to PyPI via Trusted Publishing.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute next tag
        id: semver
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            echo "HEAD is already tagged ($(git describe --exact-match --tags HEAD))."
            exit 1
          fi

          NEXT="$(python scripts/next_semver.py --bump "$BUMP")"
          if [ -z "$NEXT" ]; then
            echo "Failed to compute next SemVer tag."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${NEXT}" >/dev/null; then
            echo "Tag ${NEXT} already exists."
            exit 1
          fi

          echo "tag=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Next tag: ${NEXT} (bump=${BUMP})"

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.semver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/${TAG}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
