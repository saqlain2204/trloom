name: Release tag

# Every merge to main creates the next SemVer tag (vX.Y.Z) and a GitHub Release.
# Default bump: patch. Override via merge commit message:
#   #minor / [minor]  → minor
#   #major / [major]  → major
#   [skip release]    → do not tag
#
# Package version is derived from git tags (hatch-vcs), so we do not commit
# version bumps to main — branch protection stays intact.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag-release:
    runs-on: ubuntu-latest
    # Avoid loops if a bot commit ever lands on main.
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute next tag
        id: semver
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            echo "HEAD is already tagged ($(git describe --exact-match --tags HEAD)); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          NEXT="$(python scripts/next_semver.py --message "$COMMIT_MESSAGE")"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 2 ]; then
            echo "Skip marker found in commit message; not tagging."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$STATUS" -ne 0 ] || [ -z "$NEXT" ]; then
            echo "Failed to compute next SemVer tag."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${NEXT}" >/dev/null; then
            echo "Tag ${NEXT} already exists; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "tag=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Next tag: ${NEXT}"

      - name: Create tag and GitHub Release
        if: ${{ steps.semver.outputs.skip == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.semver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/${TAG}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
