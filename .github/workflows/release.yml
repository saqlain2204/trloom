name: Release

# Single publishing pipeline for one SemVer version.
# Actions → Release → Run workflow → choose patch / minor / major
# (or pass an existing tag to retry PyPI publish only).
#
# One-time setup on https://pypi.org/manage/project/trloom/settings/publishing/ :
#   Owner:      saqlain2204
#   Repository: trloom
#   Workflow:   release.yml
#   Environment: pypi

on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer bump (ignored when republishing an existing tag)
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      tag:
        description: Optional existing tag to republish only (e.g. v0.2.0). Leave empty to cut a new release.
        required: false
        type: string
        default: ""

permissions:
  contents: write
  id-token: write
  actions: write

jobs:
  prepare:
    name: Prepare tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: ${{ inputs.tag == '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve tag
        id: resolve
        env:
          BUMP: ${{ inputs.bump }}
          EXISTING_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${EXISTING_TAG}" ]; then
            if ! git rev-parse -q --verify "refs/tags/${EXISTING_TAG}" >/dev/null; then
              echo "Tag ${EXISTING_TAG} does not exist."
              exit 1
            fi
            echo "tag=${EXISTING_TAG}" >> "$GITHUB_OUTPUT"
            echo "Republishing existing tag: ${EXISTING_TAG}"
            exit 0
          fi

          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            echo "HEAD is already tagged ($(git describe --exact-match --tags HEAD))."
            exit 1
          fi

          NEXT="$(python scripts/next_semver.py --bump "$BUMP")"
          if [ -z "$NEXT" ]; then
            echo "Failed to compute next SemVer tag."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${NEXT}" >/dev/null; then
            echo "Tag ${NEXT} already exists."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" -m "Release $NEXT"
          git push origin "refs/tags/${NEXT}"
          gh release create "$NEXT" \
            --title "$NEXT" \
            --generate-notes \
            --verify-tag

          echo "tag=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Created release ${NEXT}"

  build:
    name: Build
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # hatch-vcs needs full history + tags for the package version.
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build
          ls -la dist/
          expected="${RELEASE_TAG#v}"
          wheel="$(ls dist/trloom-*-py3-none-any.whl)"
          got="$(basename "$wheel" | sed -n 's/^trloom-\(.*\)-py3-none-any\.whl$/\1/p')"
          echo "tag=${RELEASE_TAG} expected=${expected} built=${got}"
          if [ "$got" != "$expected" ]; then
            echo "Version mismatch: built package ${got} does not match tag ${RELEASE_TAG}"
            exit 1
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/trloom
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
