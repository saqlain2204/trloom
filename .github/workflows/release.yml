name: Publish to PyPI

# Publishes with Trusted Publishing (OIDC) — no long-lived PyPI API token.
#
# Triggered by:
#   - cut-release.yml (workflow_dispatch) after it creates a tag
#   - manual "Run workflow" (e.g. retry a failed publish)
#   - push of a v* tag created outside Actions (local git push)
#
# One-time setup on https://pypi.org/manage/project/trloom/settings/publishing/ :
#   Owner:      saqlain2204
#   Repository: trloom
#   Workflow:   release.yml
#   Environment: pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish (e.g. v0.1.2)
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # hatch-vcs needs full history + tags for the package version.
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/trloom
    permissions:
      id-token: write # mandatory for Trusted Publishing / OIDC
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
