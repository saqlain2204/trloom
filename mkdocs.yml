site_name: TRLoom
site_description: YAML-driven end-to-end fine-tuning on top of Hugging Face TRL
site_url: https://saqlain2204.github.io/trloom/
repo_url: https://github.com/saqlain2204/trloom
repo_name: saqlain2204/trloom
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/trloom.png
  favicon: assets/trloom.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Tutorial: tutorial.md
  - Guides:
      - Configuration: guides/configuration.md
      - Datasets: guides/datasets.md
      - Weights & Biases: guides/wandb.md
      - Modal: guides/modal.md
      - Examples: guides/examples.md
  - CLI: cli.md
  - API reference: api.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/saqlain2204/trloom
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/trloom/
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/imsaqlain22
