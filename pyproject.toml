[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "trloom"
version = "0.1.0"
description = "YAML-driven end-to-end fine-tuning on top of Hugging Face TRL, with W&B and Modal support."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "TRLoom contributors" }]
keywords = [
  "trl",
  "transformers",
  "fine-tuning",
  "rlhf",
  "yaml",
  "wandb",
  "modal",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "trl>=0.24.0",
  "transformers>=4.51.0",
  "datasets>=3.0.0",
  "accelerate>=1.0.0",
  "peft>=0.14.0",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "huggingface-hub>=0.26.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.18.0"]
modal = ["modal>=0.73.0"]
bitsandbytes = ["bitsandbytes>=0.45.0"]
all = [
  "trloom[wandb,modal,bitsandbytes]",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8.0",
]
docs = [
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.26.0",
]

[project.urls]
Homepage = "https://github.com/saqlain2204/trloom"
Repository = "https://github.com/saqlain2204/trloom"
Documentation = "https://saqlain2204.github.io/trloom/"
Issues = "https://github.com/saqlain2204/trloom/issues"

[project.scripts]
trloom = "trloom.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trloom"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/docs",
  "/mkdocs.yml",
  "/README.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
